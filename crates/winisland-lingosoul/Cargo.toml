[package]
name = "winisland-lingosoul"
version.workspace = true
edition = "2024"
license = "GPL-3.0-only"
authors = ["WinIslandProject"]
description = "Embedded voice and text assistant for WinIsland"

[package.metadata.upstream]
repository = "https://github.com/WinIslandProject/LingoSoul"
revision = "ed7ba0870226ce56daf6dec198171b23b8384b20"

[dependencies]
winisland-core = { path = "../winisland-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util", "fs"] }
tokio-util = "0.7"
cpal = "0.18.2"
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
pinyin = "0.11"
sha2 = "0.11"
hex = "0.4"
tar = "0.4"
bzip2 = "0.6"
similar = "2.7"
tempfile = "3.27"
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
