name: Rust Build & Docs

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      docs_only:
        description: 'Only rebuild and deploy the website'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/*.sksl'
              - '**/*.ps1'
              - 'resources/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'packaging/**'
              - '.github/workflows/rust.yml'
            web:
              - 'Page/**'
              - '**/*.md'
              - '.github/workflows/rust.yml'

  build-rust:
    needs: changes
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    if: >-
      ((github.event_name == 'workflow_dispatch' && !inputs.docs_only) ||
      (github.event_name == 'push' && needs.changes.outputs.rust == 'true')) &&
      !contains(github.event.head_commit.message, '[ci-skip]') &&
      !contains(github.event.head_commit.message, '[docs]')
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      uses: swatinem/rust-cache@v2
    - name: Install dependencies
      run: |
        choco install ninja innosetup -y
    - name: Build Release
      run: cargo build --release --verbose
      env:
        WINISLAND_PACKAGE_CHANNEL: nightly
        WINISLAND_BUILD_NUMBER: ${{ github.run_number }}
    - name: Restore identity signing certificate
      shell: pwsh
      env:
        WINISLAND_MSIX_CERT_PFX_BASE64: ${{ secrets.WINISLAND_MSIX_CERT_PFX_BASE64 }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:WINISLAND_MSIX_CERT_PFX_BASE64)) {
          throw 'WINISLAND_MSIX_CERT_PFX_BASE64 is not configured.'
        }
        $certificatePath = Join-Path $env:RUNNER_TEMP 'winisland-identity.pfx'
        [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINISLAND_MSIX_CERT_PFX_BASE64))
        "WINISLAND_MSIX_CERT_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Build Nightly Installer
      shell: pwsh
      env:
        WINISLAND_MSIX_CERT_PASSWORD: ${{ secrets.WINISLAND_MSIX_CERT_PASSWORD }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:WINISLAND_MSIX_CERT_PASSWORD)) {
          throw 'WINISLAND_MSIX_CERT_PASSWORD is not configured.'
        }
        $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
          Where-Object { $_.name -eq 'WinIsland' } |
          Select-Object -ExpandProperty version
        if ($env:GITHUB_RUN_NUMBER -gt 65535) {
          throw 'GITHUB_RUN_NUMBER exceeds the MSIX version range.'
        }
        .\packaging\installer\Build-Installer.ps1 `
          -Channel nightly `
          -Version "$version.$env:GITHUB_RUN_NUMBER" `
          -CertificatePath $env:WINISLAND_MSIX_CERT_PATH `
          -CertificatePassword $env:WINISLAND_MSIX_CERT_PASSWORD `
          -OutputDirectory .\target\installer\nightly
    - name: Generate Version Info
      shell: pwsh
      run: |
        $date = [DateTime]::UtcNow
        $installerPath = 'target/installer/nightly/installer/WinIsland-Nightly-Setup.exe'
        $json = @{
          build_number = [uint64]$env:GITHUB_RUN_NUMBER
          built_at = $date.ToString("yyyy-MM-dd HH:mm:ss 'UTC'")
          installer_sha256 = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          timestamp = $date.AddHours(8).ToString('yyyy-MM-dd HH:mm:ss')
        } | ConvertTo-Json
        $json | Out-File -FilePath target/release/version_info.json -Encoding utf8
    - name: Check published Nightly build
      id: nightly-source
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      shell: pwsh
      run: |
        $published = try {
          Invoke-RestMethod -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/nightly/version_info.json?run=$env:GITHUB_RUN_ID" -TimeoutSec 30
        } catch {
          if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
          $null
        }
        if ($null -ne $published -and [uint64]$published.build_number -gt [uint64]$env:GITHUB_RUN_NUMBER) {
          Write-Output 'Skipping a Nightly build superseded by a newer commit.'
          'publish=false' >> $env:GITHUB_OUTPUT
        } else {
          'publish=true' >> $env:GITHUB_OUTPUT
        }
    - name: Upload Nightly Release
      uses: softprops/action-gh-release@v2
      if: steps.nightly-source.outputs.publish == 'true'
      with:
        tag_name: nightly
        target_commitish: ${{ github.sha }}
        name: Nightly Build
        draft: false
        prerelease: true
        files: |
          target/installer/nightly/installer/WinIsland-Nightly-Setup.exe
          target/release/version_info.json
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Update Nightly tag
      if: steps.nightly-source.outputs.publish == 'true'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/nightly" -f "sha=$env:GITHUB_SHA" -F force=true --silent
        if ($LASTEXITCODE -ne 0) { throw 'Failed to update the Nightly tag.' }

  build-docs:
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true') &&
      !contains(github.event.head_commit.message, '[ci-skip]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Page/package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: Page
        run: npm ci
      - name: Include latest stable installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p Page/public/download
          gh release download --repo "${{ github.repository }}" --pattern WinIsland-Setup.exe --dir Page/public/download --clobber
      - name: Include versioned Store installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          entries = json.loads(Path('Page/store-downloads.json').read_text(encoding='utf-8'))
          if not isinstance(entries, list):
              raise ValueError('Store downloads must be a JSON array.')
          patterns = {
              'release_tag': r'[A-Za-z0-9][A-Za-z0-9._-]*',
              'asset': r'[A-Za-z0-9][A-Za-z0-9._-]*\.exe',
              'version': r'[0-9]+(?:\.[0-9]+){3}',
              'sha256': r'[0-9a-fA-F]{64}',
          }
          versions = set()
          for entry in entries:
              if not isinstance(entry, dict):
                  raise ValueError('Each Store download must be an object.')
              for field, pattern in patterns.items():
                  value = entry.get(field)
                  if not isinstance(value, str) or not re.fullmatch(pattern, value):
                      raise ValueError(f'Invalid Store download field: {field}')
              version = entry['version']
              if any(int(part) > 65535 for part in version.split('.')):
                  raise ValueError(f'Invalid Windows package version: {version}')
              if version in versions:
                  raise ValueError(f'Duplicate Store download version: {version}')
              versions.add(version)

          for entry in entries:
              target = Path('Page/public/download') / entry['version'] / 'WinIsland-Setup.exe'
              target.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run([
                  'gh', 'release', 'download', entry['release_tag'],
                  '--repo', os.environ['GITHUB_REPOSITORY'],
                  '--pattern', entry['asset'], '--output', str(target), '--clobber',
              ], check=True)
              actual_hash = hashlib.sha256(target.read_bytes()).hexdigest()
              if actual_hash != entry['sha256'].lower():
                  raise ValueError(f'SHA-256 mismatch for Store installer {entry["version"]}')
              print(f'Included Store installer {entry["version"]}: {actual_hash}')
          PY
      - name: Build website
        working-directory: Page
        run: npm run build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Page/dist

  deploy-docs:
    if: >-
      always() &&
      github.repository == 'WinIslandProject/WinIsland' &&
      !contains(github.event.head_commit.message, '[ci-skip]') &&
      needs.build-docs.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [changes, build-docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
